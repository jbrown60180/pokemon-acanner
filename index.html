<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScanner</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>PokéScanner</h1>
    <p>Scan, Collect & Value Your Pokémon Cards</p>
</header>

<main>

<div class="card">
    <h2>📷 Scan Card</h2>

    <video id="camera"
           autoplay
           playsinline
           style="display:none;width:100%;border-radius:15px;"></video>

    <canvas id="snapshot"
            style="display:none;"></canvas>

    <img id="preview"
         style="display:none;width:100%;border-radius:15px;margin-top:15px;">

    <br><br>

    <button id="scanButton">Start Camera</button>

    <button id="captureButton" style="display:none;">
        📸 Capture Card
    </button>

</div>

<div class="card">
    <h2>📚 My Collection</h2>
    <p>0 Cards</p>
</div>

<div class="card">
    <h2>💰 Collection Value</h2>
    <p>$0.00</p>
</div>

<div class="card">
    <h2>⭐ Favorites</h2>
    <p>No favorite cards yet.</p>
</div>

</main>

<div id="scannerArea"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js"></script>

</body>
</html>
